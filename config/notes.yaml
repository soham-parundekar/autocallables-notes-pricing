# Term sheets for the six notes priced in the week of 5-9 October 2026.
#
# Every scalar here was read off the final 424B2 pricing supplement by hand and
# cross-checked against the preserved filing under references/sec_filings/.
# tests/test_term_sheets_match_filings.py re-reads those filings and asserts the
# numbers below still match, so this file cannot silently drift from its source.
#
# The observation and payment schedules were pulled from the filings
# programmatically and their lengths asserted against the stated tenor and
# coupon frequency. Transcribing 60 business-day-adjusted dates by hand invites
# exactly the kind of error that is impossible to spot later.
#
# Initial levels agree across four independent supplements where they overlap
# (NDX 31,160.08 and RTY 2,793.204 appear in the JPMorgan, Goldman and both
# Morgan Stanley notes priced 7 October), which is the cleanest available check
# that the extraction is right.
#
# A note on barrier vocabulary: issuers use different words for the same two
# levels. JPMorgan says "Interest Barrier" and "Trigger Value", Morgan Stanley
# says "coupon barrier level" and "downside threshold level", Goldman says
# "coupon trigger level" and "trigger buffer level", BofA says "Coupon Barrier"
# and a knock-in. They are normalised here to coupon.barrier and
# downside.trigger, both expressed as a fraction of each underlying's own
# initial level.

